name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-dsp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository structure and source
        run: node scripts/validate-repository.mjs
      - name: Test platform capability detection
        run: node tests/platform-capabilities.test.mjs
      - name: Run deterministic Obfuscation worklet test
        run: node tests/obfuscation-body-harness.mjs
      - name: Build and test portable native DSP core
        run: |
          cmake -S . -B build-core -DLAE_BUILD_PLUGINS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core --config Release --parallel
          ctest --test-dir build-core -C Release --output-on-failure
      - name: Install JUCE compile prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev
      - name: Compile the Tape V2 plugin and editor
        run: |
          cmake -S . -B build-tape -DLAE_BUILD_PLUGINS=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tape --target TapeEngine_VST3 --parallel 2
      - name: Run browser DSP and responsive harnesses
        run: node scripts/run-browser-harnesses.mjs --ci
      - name: Generate deterministic parity fixtures
        run: python tests/parity/parity.py generate --out tests/parity/fixtures
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-chromium-browser-evidence
          path: .artifacts/platform-browser-results.json
          if-no-files-found: warn

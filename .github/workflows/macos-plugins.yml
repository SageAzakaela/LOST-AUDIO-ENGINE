name: Mac universal plugin beta

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-universal-beta]
    paths:
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'native/**'
      - '*-vst3/**'
      - 'scripts/macos_plugins.py'
      - 'installer/macos/**'
      - '.github/workflows/macos-plugins.yml'
  pull_request:
    paths:
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'native/**'
      - '*-vst3/**'
      - 'scripts/macos_plugins.py'
      - 'installer/macos/**'
      - '.github/workflows/macos-plugins.yml'

permissions:
  contents: read

concurrency:
  group: mac-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: decks
            projects: 'tape-vst3;cd-vst3;cartridge-vst3'
          - group: broadcast
            projects: 'transmission-vst3;comms-vst3;television-vst3'
          - group: spaces
            projects: 'camcorder-vst3;conference-vst3;occlusion-vst3;openmicnight-vst3'
          - group: creative
            projects: 'brain-cruncher-vst3;suite-vst3;sequencer-vst3'
    steps:
      - uses: actions/checkout@v7
      - name: Configure universal AU and VST3 plugins
        run: >-
          cmake -S . -B build-mac -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          '-DLAE_PLUGIN_FORMATS=VST3;AU' '-DLAE_PLUGIN_PROJECTS=${{ matrix.projects }}'
      - name: Build both architectures
        run: cmake --build build-mac --parallel 3
      - name: Inspect and stage complete bundles
        run: >-
          python3 scripts/macos_plugins.py stage --build build-mac
          --output bundles --projects '${{ matrix.projects }}'
      - name: Preserve Mac bundle permissions and signatures
        run: ditto -c -k --sequesterRsrc --keepParent bundles mac-${{ matrix.group }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: mac-build-${{ matrix.group }}
          path: mac-${{ matrix.group }}.zip
          if-no-files-found: error

  core-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and exercise DSP on the native CPU
        run: |
          cmake -S . -B build-core -G Ninja -DLAE_BUILD_PLUGINS=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=$(uname -m)
          cmake --build build-core --parallel 3
          ctest --test-dir build-core --output-on-failure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-core-${{ matrix.runner }}
          path: build-core/Testing/Temporary/LastTest.log

  host-validation:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        group: [decks, broadcast, spaces, creative]
        include:
          - group: decks
            projects: 'tape-vst3;cd-vst3;cartridge-vst3'
          - group: broadcast
            projects: 'transmission-vst3;comms-vst3;television-vst3'
          - group: spaces
            projects: 'camcorder-vst3;conference-vst3;occlusion-vst3;openmicnight-vst3'
          - group: creative
            projects: 'brain-cruncher-vst3;suite-vst3;sequencer-vst3'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: mac-build-${{ matrix.group }}
      - name: Extract the exact universal bundles
        run: ditto -x -k mac-${{ matrix.group }}.zip .
      - name: Fetch pinned pluginval
        run: |
          curl --fail --location --retry 3 https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o pluginval.zip
          echo '3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip' | shasum -a 256 -c -
          ditto -x -k pluginval.zip pluginval
      - name: Validate AU and VST3 scanning, processing, state and editors
        run: >-
          python3 scripts/macos_plugins.py validate --bundles bundles
          --pluginval pluginval/pluginval.app/Contents/MacOS/pluginval
          --logs validation --projects '${{ matrix.projects }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-validation-${{ matrix.runner }}-${{ matrix.group }}
          path: validation/
          if-no-files-found: warn

  package:
    needs: [core-tests, host-validation]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: mac-build-*
          path: incoming
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: mac-validation-*
          path: evidence
      - name: Assemble validated universal fleet
        run: |
          mkdir combined
          for archive in incoming/*.zip; do
            ditto -x -k "$archive" combined
          done
          rm combined/bundles/build-manifest.json
          python3 scripts/macos_plugins.py package --bundles combined/bundles --evidence evidence --output dist/macos
      - uses: actions/upload-artifact@v7
        with:
          name: be-digital-mac-universal-dev
          path: dist/macos/
          if-no-files-found: error

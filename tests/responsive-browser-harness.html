<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LOST responsive browser harness</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #181a1d; color: #f4efe5; font: 13px/1.4 ui-monospace,monospace; }
      body { padding: 20px; }
      header { width: min-content; min-width: 390px; margin: 0 auto 12px; display: flex; justify-content: space-between; gap: 30px; }
      #metrics { width: min-content; min-width: 390px; margin: 12px auto 0; color: #9dfff7; white-space: nowrap; }
      iframe { display: block; margin: 0 auto; border: 1px solid #4ef6ff; background: #08090a; }
    </style>
  </head>
  <body>
    <header><strong id="label"></strong><span>responsive QA viewport</span></header>
    <iframe id="preview" title="LOST responsive preview"></iframe>
    <div id="metrics">waiting for workstation…</div>
    <pre id="results" hidden>RUNNING</pre>
    <script>
      const params = new URLSearchParams(location.search);
      const width = Math.max(320, Math.min(1920, Number(params.get("width")) || 1366));
      const height = Math.max(480, Math.min(1200, Number(params.get("height")) || 768));
      const preview = document.getElementById("preview");
      preview.width = width;
      preview.height = height;
      preview.src = `../?responsive-qa=${width}x${height}&harness=${Date.now()}`;
      document.getElementById("label").textContent = `${width} × ${height}`;
      preview.addEventListener("load", () => {
        const doc = preview.contentDocument;
        const root = doc.documentElement;
        const workstationVisible = getComputedStyle(doc.querySelector(".workstation-shell")).display !== "none";
        const mobileVisible = getComputedStyle(doc.querySelector(".mobile-gate")).display !== "none";
        const mobileDockVisible = getComputedStyle(doc.querySelector(".mobile-workflow-dock")).display !== "none";
        const panelSelectors = [".device-library", ".rack-bay", ".device-inspector", "#toolDrawer"];
        const visiblePanels = panelSelectors.filter((selector) => getComputedStyle(doc.querySelector(selector)).display !== "none");
        const dockTargets = [...doc.querySelectorAll(".mobile-workflow-dock button")].map((button) => button.getBoundingClientRect().height);
        const header = doc.querySelector(".workstation-header");
        const headerContained = header.scrollWidth <= header.clientWidth + 1;
        const levelControlsContained = [...doc.querySelectorAll(".header-level")]
          .every((control) => control.scrollWidth <= control.clientWidth + 1);
        const isMobile = width <= 960;
        const pass = ! (root.scrollWidth > root.clientWidth)
          && workstationVisible
          && !mobileVisible
          && headerContained
          && levelControlsContained
          && (isMobile ? mobileDockVisible && visiblePanels.length === 1 && dockTargets.every((height) => height >= 44) : !mobileDockVisible);
        const results = {
          width,
          height,
          clientWidth: root.clientWidth,
          scrollWidth: root.scrollWidth,
          horizontalOverflow: root.scrollWidth > root.clientWidth,
          workstationVisible,
          mobileVisible,
          mobileDockVisible,
          activeMobilePanel: doc.body.dataset.mobilePanel || "",
          visiblePanels,
          headerContained,
          levelControlsContained,
          minimumDockTarget: dockTargets.length ? Math.min(...dockTargets) : null,
          pass,
        };
        document.getElementById("metrics").textContent = [
          `client ${root.clientWidth}px`,
          `scroll ${root.scrollWidth}px`,
          `horizontal overflow ${root.scrollWidth > root.clientWidth ? "YES" : "no"}`,
          `workstation ${workstationVisible ? "visible" : "hidden"}`,
          `mobile rack ${mobileDockVisible ? "active" : "inactive"}`,
          `result ${pass ? "PASS" : "FAIL"}`,
        ].join("  /  ");
        document.getElementById("results").textContent = JSON.stringify(results, null, 2);
        document.body.dataset.pass = pass ? "true" : "false";
        document.body.dataset.complete = "true";
      });
    </script>
  </body>
</html>

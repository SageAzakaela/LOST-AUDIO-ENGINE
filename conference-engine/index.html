<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conference Engine</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>Conference Engine</h1>
          <p class="sub">VoIP / call app glitch simulator (packet loss + jitter + codec)</p>
        </div>
        <div class="headerActions">
          <label class="file">
            <input id="fileInput" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg" />
            <span>Upload WAV/MP3</span>
          </label>
          <button id="playBtn" class="primary" disabled>Play</button>
          <button id="stopBtn" disabled>Stop</button>
          <label class="toggle headerToggle">
            <input id="loopToggle" type="checkbox" />
            <span>Loop</span>
          </label>
          <button id="exportBtn" disabled>Export WAV</button>
        </div>
      </header>

      <section class="panel">
        <div class="controls">
          <div class="control">
            <div class="labelRow">
              <label for="mode">App Mode</label>
              <span id="modeVal" class="val"></span>
            </div>
            <select id="mode">
              <option value="discord">Discord</option>
              <option value="zoom">Zoom</option>
              <option value="skype">Skype</option>
              <option value="cell">Cell / Hotspot</option>
            </select>
          </div>

          <div class="control">
            <div class="labelRow">
              <label for="bandwidth">Bandwidth</label>
              <span id="bandwidthVal" class="val"></span>
            </div>
            <input id="bandwidth" type="range" min="0" max="1" step="0.001" value="0.45" />
          </div>

          <div class="control">
            <div class="labelRow">
              <label for="codec">Codec / Quality</label>
              <span id="codecVal" class="val"></span>
            </div>
            <input id="codec" type="range" min="0" max="1" step="0.001" value="0.35" />
          </div>

          <div class="control">
            <div class="labelRow">
              <label for="dropouts">Dropouts</label>
              <span id="dropoutsVal" class="val"></span>
            </div>
            <input id="dropouts" type="range" min="0" max="1" step="0.001" value="0.25" />
          </div>

          <div class="control">
            <div class="labelRow">
              <label for="jitter">Jitter</label>
              <span id="jitterVal" class="val"></span>
            </div>
            <input id="jitter" type="range" min="0" max="1" step="0.001" value="0.2" />
          </div>

          <div class="control">
            <div class="labelRow">
              <label for="robot">Robot / Stutter</label>
              <span id="robotVal" class="val"></span>
            </div>
            <input id="robot" type="range" min="0" max="1" step="0.001" value="0.12" />
          </div>

          <div class="control">
            <div class="labelRow">
              <label for="noise">Noise</label>
              <span id="noiseVal" class="val"></span>
            </div>
            <input id="noise" type="range" min="0" max="1" step="0.001" value="0.12" />
          </div>

          <div class="controlRow">
            <div class="selectWrap">
              <label for="preset">Preset</label>
              <select id="preset"></select>
            </div>
          </div>

          <details class="advanced">
            <summary>Advanced Tuning</summary>
            <div class="advGrid">
              <div class="control">
                <div class="labelRow">
                  <label for="hpHz">High-pass</label>
                  <span id="hpHzVal" class="val"></span>
                </div>
                <input id="hpHz" type="range" min="80" max="900" step="1" value="260" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="lpHz">Low-pass</label>
                  <span id="lpHzVal" class="val"></span>
                </div>
                <input id="lpHz" type="range" min="1200" max="12000" step="10" value="4200" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="midHumpDb">Presence</label>
                  <span id="midHumpDbVal" class="val"></span>
                </div>
                <input id="midHumpDb" type="range" min="0" max="12" step="0.05" value="2.2" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="midFreq">Presence Freq</label>
                  <span id="midFreqVal" class="val"></span>
                </div>
                <input id="midFreq" type="range" min="900" max="4200" step="10" value="1750" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="concealMode">Conceal Mode</label>
                  <span id="concealModeVal" class="val"></span>
                </div>
                <select id="concealMode">
                  <option value="hold">Hold</option>
                  <option value="mute">Mute</option>
                  <option value="interp">Interpolate</option>
                  <option value="repeat">Repeat Frames</option>
                </select>
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="packetLoss">Packet Loss</label>
                  <span id="packetLossVal" class="val"></span>
                </div>
                <input id="packetLoss" type="range" min="0" max="1" step="0.001" value="0.18" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="packetMs">Packet Size</label>
                  <span id="packetMsVal" class="val"></span>
                </div>
                <input id="packetMs" type="range" min="8" max="180" step="1" value="24" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="repeatMs">Repeat Depth</label>
                  <span id="repeatMsVal" class="val"></span>
                </div>
                <input id="repeatMs" type="range" min="6" max="240" step="1" value="42" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="jitterMs">Jitter Depth</label>
                  <span id="jitterMsVal" class="val"></span>
                </div>
                <input id="jitterMs" type="range" min="0" max="2" step="0.01" value="0.12" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="jitterRate">Jitter Rate</label>
                  <span id="jitterRateVal" class="val"></span>
                </div>
                <input id="jitterRate" type="range" min="6" max="140" step="1" value="34" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="gate">Noise Gate</label>
                  <span id="gateVal" class="val"></span>
                </div>
                <input id="gate" type="range" min="0" max="1" step="0.001" value="0.12" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="bits">Bit Depth</label>
                  <span id="bitsVal" class="val"></span>
                </div>
                <input id="bits" type="range" min="4" max="16" step="1" value="12" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="rate">Sample Rate</label>
                  <span id="rateVal" class="val"></span>
                </div>
                <input id="rate" type="range" min="6000" max="48000" step="100" value="24000" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="ceiling">Ceiling</label>
                  <span id="ceilingVal" class="val"></span>
                </div>
                <input id="ceiling" type="range" min="0.2" max="1" step="0.001" value="0.92" />
              </div>

              <div class="control">
                <div class="labelRow">
                  <label for="outGain">Output Gain</label>
                  <span id="outGainVal" class="val"></span>
                </div>
                <input id="outGain" type="range" min="0" max="1.5" step="0.01" value="0.98" />
              </div>
            </div>
          </details>
        </div>

        <div class="status">
          <div><span class="k">File</span> <span id="fileName" class="v">None</span></div>
          <div><span class="k">Duration</span> <span id="duration" class="v">-</span></div>
          <div><span class="k">Sample Rate</span> <span id="sampleRate" class="v">-</span></div>
          <div><span class="k">State</span> <span id="state" class="v">Idle</span></div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>

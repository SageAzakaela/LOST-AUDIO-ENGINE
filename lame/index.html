<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lost Audio Engine</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="title">
          <h1>Lost Audio Engine</h1>
          <p class="sub">Modular ƒ?olost mediaƒ?? device chain: toggle modules, set wetness, bounce WAV.</p>
        </div>

        <div class="topActions">
          <label class="file">
            <input id="fileInput" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg" />
            <span>Upload WAV/MP3</span>
          </label>
          <label class="selectWrap">
            <span class="selectLabel">View</span>
            <select id="viewSelect"></select>
          </label>
          <label class="selectWrap">
            <span class="selectLabel">Master Preset</span>
            <select id="masterPreset"></select>
          </label>
          <button id="saveMasterPresetBtn" class="miniBtn" type="button">Save Preset</button>
          <button id="deleteMasterPresetBtn" class="miniBtn" type="button" disabled>Delete</button>
          <button id="playBtn" class="primary" disabled>Play</button>
          <button id="stopBtn" disabled>Stop</button>
          <label class="toggle">
            <input id="loopToggle" type="checkbox" />
            <span>Loop</span>
          </label>
          <button id="exportBtn" disabled>Export WAV</button>
        </div>

        <section class="master">
          <div class="masterGrid">
            <div class="control">
              <div class="labelRow">
                <label for="masterGain">Master Gain</label>
                <span id="masterGainVal" class="val"></span>
              </div>
              <input id="masterGain" type="range" min="0" max="1.5" step="0.01" value="0.25" />
            </div>

            <div class="control">
              <div class="labelRow">
                <label for="masterHpHz">Master HP</label>
                <span id="masterHpHzVal" class="val"></span>
              </div>
              <input id="masterHpHz" type="range" min="20" max="800" step="1" value="20" />
            </div>

            <div class="control">
              <div class="labelRow">
                <label for="masterLpHz">Master LP</label>
                <span id="masterLpHzVal" class="val"></span>
              </div>
              <input id="masterLpHz" type="range" min="2000" max="20000" step="10" value="20000" />
            </div>

            <div class="control">
              <div class="labelRow">
                <label for="masterComp">Master Comp</label>
                <span id="masterCompVal" class="val"></span>
              </div>
              <input id="masterComp" type="range" min="0" max="1" step="0.001" value="0" />
            </div>

            <div class="control">
              <div class="labelRow">
                <label for="ceiling">Ceiling</label>
                <span id="ceilingVal" class="val"></span>
              </div>
              <input id="ceiling" type="range" min="0.2" max="1" step="0.001" value="0.92" />
            </div>

            <div class="control">
              <div class="labelRow">
                <label for="limiter">Limiter</label>
                <span id="limiterVal" class="val"></span>
              </div>
              <input id="limiter" type="range" min="0" max="1" step="0.001" value="0.45" />
            </div>

            <div class="control">
              <div class="labelRow">
                <label>Options</label>
                <span class="val" id="optsVal"></span>
              </div>
              <div class="optRow">
                <label class="toggle">
                  <input id="softClip" type="checkbox" checked />
                  <span>Soft Clip</span>
                </label>
                <label class="toggle">
                  <input id="monoOut" type="checkbox" checked />
                  <span>Mono Output</span>
                </label>
              </div>
            </div>
          </div>

          <div class="status">
            <div><span class="k">File</span> <span id="fileName" class="v">None</span></div>
            <div><span class="k">Duration</span> <span id="duration" class="v">-</span></div>
            <div><span class="k">Sample Rate</span> <span id="sampleRate" class="v">-</span></div>
            <div><span class="k">State</span> <span id="state" class="v">Idle</span></div>
          </div>
        </section>
      </header>

      <section class="modules">
        <div id="moduleRow" class="moduleRow"></div>
      </section>

      <section id="automationView" class="automation hidden">
        <div class="automationBar">
          <div class="control slim">
            <div class="labelRow">
              <label for="autoBpm">BPM</label>
              <span id="autoBpmVal" class="val"></span>
            </div>
            <input id="autoBpm" type="number" min="30" max="240" step="0.1" value="120" />
          </div>
          <div class="control slim">
            <div class="labelRow">
              <label for="autoZoom">Zoom</label>
              <span id="autoZoomVal" class="val"></span>
            </div>
            <input id="autoZoom" type="range" min="20" max="400" step="1" value="100" />
          </div>
          <label class="toggle">
            <input id="autoSnap" type="checkbox" checked />
            <span>Snap</span>
          </label>
          <div class="control slim">
            <div class="labelRow">
              <label>Length</label>
              <span id="autoLenVal" class="val"></span>
            </div>
            <div id="autoLenText" class="val">-</div>
          </div>
          <div class="control slim">
            <div class="labelRow">
              <label for="autoTarget">Automation</label>
              <span class="val">Wet/Enable</span>
            </div>
            <select id="autoTarget"></select>
          </div>
        </div>

        <div class="automationWrap">
          <div id="automationTracks" class="automationTracks"></div>
          <div class="automationLane">
            <canvas id="autoLaneCanvas" width="1200" height="140"></canvas>
            <div class="laneHint">Click to add • Drag to move • Right-click to delete</div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <a href="./README.md" target="_blank" rel="noreferrer">README</a>
        <span class="sep">’'?ƒ?§</span>
        <span class="muted">Preview and export share the same modular graph.</span>
      </footer>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
